<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端连接测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info-content {
            color: #333;
            font-size: 14px;
            line-height: 1.6;
        }
        .info-content code {
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #d63384;
        }
        .test-section {
            margin: 30px 0;
        }
        .test-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-indicator.success {
            background: #28a745;
        }
        .status-indicator.error {
            background: #dc3545;
        }
        .status-indicator.pending {
            background: #ffc107;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .step-list {
            list-style: none;
            counter-reset: step-counter;
        }
        .step-list li {
            counter-increment: step-counter;
            margin-bottom: 15px;
            padding-left: 40px;
            position: relative;
        }
        .step-list li::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 0;
            width: 28px;
            height: 28px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        .note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #856404;
        }
        .note strong {
            color: #664d03;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 移动端连接测试</h1>

        <div class="info-box">
            <div class="info-title">📋 服务器信息</div>
            <div class="info-content">
                <p>局域网地址: <code id="serverUrl">http://192.168.1.34:5000</code></p>
                <p>默认账户: <code>admin</code> / <code>admin123</code></p>
            </div>
        </div>

        <div class="note">
            <strong>⚠️ 重要提示：</strong>
            <p>确保您的手机和电脑连接到同一个 WiFi 网络。</p>
        </div>

        <div class="test-section">
            <div class="test-title">1️⃣ 测试服务器连接</div>
            <button onclick="testConnection()">测试连接</button>
            <div id="connectionResult" class="result"></div>
        </div>

        <div class="test-section">
            <div class="test-title">2️⃣ 测试登录功能</div>
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="username" value="admin" placeholder="请输入用户名">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" value="admin123" placeholder="请输入密码">
            </div>
            <button onclick="testLogin()">测试登录</button>
            <div id="loginResult" class="result"></div>
        </div>

        <div class="test-section">
            <div class="test-title">3️⃣ 测试 API 接口</div>
            <button onclick="testAPI()">测试人员列表 API</button>
            <div id="apiResult" class="result"></div>
        </div>

        <div class="info-box">
            <div class="info-title">📱 配置移动端应用</div>
            <div class="info-content">
                <ol class="step-list">
                    <li>打开移动端应用</li>
                    <li>进入设置页面</li>
                    <li>修改 API 域名为: <code id="mobileUrl">http://192.168.1.34:5000</code></li>
                    <li>保存并重启应用</li>
                    <li>使用上述账户登录</li>
                </ol>
            </div>
        </div>
    </div>

    <script>
        // API 基础 URL
        let API_BASE = 'http://192.168.1.34:5000';
        let authToken = null;

        // 测试连接
        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<span class="status-indicator pending"></span>正在测试连接...';

            try {
                const response = await fetch(`${API_BASE}/`);
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '<span class="status-indicator success"></span>✓ 连接成功！服务器运行正常。';
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<span class="status-indicator error"></span>✗ 连接失败: ${error.message}<br><br>
                    <strong>可能的原因：</strong><br>
                    • 手机和电脑不在同一 WiFi 网络<br>
                    • 服务器未运行<br>
                    • 防火墙阻止了连接`;
            }
        }

        // 测试登录
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '✗ 请输入用户名和密码';
                return;
            }

            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<span class="status-indicator pending"></span>正在登录...';

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    authToken = data.token;
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<span class="status-indicator success"></span>✓ 登录成功！<br><br>
                        <strong>用户信息：</strong><br>
                        • 用户名: ${data.user.username}<br>
                        • 角色: ${data.user.role}<br>
                        • 真实姓名: ${data.user.real_name}<br><br>
                        <strong>Token:</strong> ${authToken.substring(0, 20)}...`;
                } else {
                    throw new Error(data.error || '登录失败');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<span class="status-indicator error"></span>✗ 登录失败: ${error.message}`;
            }
        }

        // 测试 API
        async function testAPI() {
            const resultDiv = document.getElementById('apiResult');

            if (!authToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '✗ 请先登录';
                return;
            }

            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<span class="status-indicator pending"></span>正在测试 API...';

            try {
                const response = await fetch(`${API_BASE}/api/persons`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<span class="status-indicator success"></span>✓ API 测试成功！<br><br>
                        <strong>人员列表：</strong><br>
                        共 ${data.persons ? data.persons.length : 0} 条记录`;
                } else {
                    throw new Error(data.error || 'API 调用失败');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<span class="status-indicator error"></span>✗ API 测试失败: ${error.message}`;
            }
        }

        // 自动检测 IP
        function detectIP() {
            // 这个页面应该在本地服务器上访问
            // 从当前 URL 提取 IP
            const currentUrl = window.location.href;
            const match = currentUrl.match(/http:\/\/([\d.]+):/);
            if (match) {
                API_BASE = `http://${match[1]}:5000`;
                document.getElementById('serverUrl').textContent = API_BASE;
                document.getElementById('mobileUrl').textContent = API_BASE;
            }
        }

        // 页面加载时检测 IP
        detectIP();
    </script>
</body>
</html>
