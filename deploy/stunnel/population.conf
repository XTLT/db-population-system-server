; 人口通 mTLS 终止配置（stunnel）
; 对外监听 __PORT__（IPv6 dual-stack：同时服务 IPv4 + IPv6，双向证书校验），
; 转发到 gunicorn 127.0.0.1:__INNER_PORT__
cert = __CERT_DIR__/server.crt
key = __CERT_DIR__/server.key
CAfile = __CERT_DIR__/ca.crt
verify = 2
sslVersion = TLSv1.2
foreground = yes
pid = /run/stunnel-__NAME__.pid

[population]
accept = :::__PORT__
connect = 127.0.0.1:__INNER_PORT__
