; 人口通 mTLS 终止配置（stunnel 5.68，26 服务器 /etc/stunnel/population.conf）
; 对外监听 5000（双向证书校验 verify=2），转发到 gunicorn 127.0.0.1:5001
; 证书路径以 systemd 实际使用的 data/certs 为准
cert = /root/population-system/data/certs/server.crt
key = /root/population-system/data/certs/server.key
CAfile = /root/population-system/data/certs/server.crt
verify = 2
sslVersion = TLSv1.2
foreground = yes
pid = /run/stunnel-population.pid

[population]
accept = 0.0.0.0:5000
connect = 127.0.0.1:5001
